[project]
name = "bleurs"
version = "0.1.0"
description = "A deterministic firewall for AI coding agents. Blocks hallucinated imports and APIs before they reach disk."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Anand Biju" }]
keywords = [
    "llm",
    "hallucination",
    "static-analysis",
    "ai-agents",
    "claude-code",
    "slopsquatting",
    "supply-chain",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]

# Zero runtime dependencies. This is a deliberate constraint, not an oversight:
# a firewall you have to build an environment for is a firewall nobody installs.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/Anandb71/Bleurs"
Issues = "https://github.com/Anandb71/Bleurs/issues"

[project.scripts]
bleurs = "bleurs.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bleurs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# registry_smoke talks to the real PyPI and is run separately, not collected.
addopts = "-q --ignore=tests/registry_smoke.py"
