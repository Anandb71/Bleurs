[project]
name = "bleurs"
version = "0.1.0"
description = "Ground truth for AI coding agents. Blocks the APIs that don't exist, serves the ones that do."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Anand Biju" }]
keywords = [
    "llm",
    "hallucination",
    "static-analysis",
    "ai-agents",
    "claude-code",
    "typescript",
    "slopsquatting",
    "supply-chain",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]

# Zero runtime dependencies. This is a deliberate constraint, not an oversight:
# a firewall you have to build an environment for is a firewall nobody installs.
dependencies = []

[project.optional-dependencies]
# TypeScript and JavaScript support. Kept optional so the core install stays
# dependency-free -- a Python-only user should never pay for grammars they
# will not load.
typescript = ["tree-sitter>=0.23", "tree-sitter-typescript>=0.23"]
dev = ["pytest>=7.0", "tree-sitter>=0.23", "tree-sitter-typescript>=0.23"]

[project.urls]
Homepage = "https://github.com/Anandb71/Bleurs"
Issues = "https://github.com/Anandb71/Bleurs/issues"

[project.scripts]
bleurs = "bleurs.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bleurs"]

[tool.hatch.build.targets.wheel.force-include]
"src/bleurs/truth/platform_surface.json" = "bleurs/truth/platform_surface.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
# registry_smoke talks to the real PyPI and is run separately, not collected.
addopts = "-q --ignore=tests/registry_smoke.py"
