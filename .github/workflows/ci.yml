name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      # Every job reports the stdlib surface it can actually see. The union
      # across three operating systems and four Python versions is the set of
      # names that exist somewhere, which is the only sound basis for deciding
      # that a platform-specific name exists nowhere.
      - name: Dump stdlib surface
        run: python benchmark/dump_stdlib_surface.py > surface-${{ matrix.os }}-${{ matrix.python }}.json

      - uses: actions/upload-artifact@v4
        with:
          name: stdlib-surface-${{ matrix.os }}-${{ matrix.python }}
          path: surface-*.json
          retention-days: 7

      # The suite stubs the network, so this is the only step that proves the
      # registry tier works against the real PyPI. Allowed to fail: a CI runner
      # with no egress must not turn into a red build on a correct commit.
      - name: Registry smoke test
        continue-on-error: true
        run: python tests/registry_smoke.py

  dogfood:
    name: bleurs checks bleurs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      # The demo files are deliberately full of hallucinations. Everything else
      # must come back clean.
      - run: bleurs check src/bleurs tests --exclude demo
