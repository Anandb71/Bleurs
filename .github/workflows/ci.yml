name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      # The suite stubs the network, so this is the only step that proves the
      # registry tier works against the real PyPI. Allowed to fail: a CI runner
      # with no egress must not turn into a red build on a correct commit.
      - name: Registry smoke test
        continue-on-error: true
        run: python tests/registry_smoke.py

  dogfood:
    name: bleurs checks bleurs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      # The demo files are deliberately full of hallucinations. Everything else
      # must come back clean.
      - run: bleurs check src/bleurs tests --exclude demo
